<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanFrame HDMI</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
html,body{margin:0;height:100%;background:#0b0d12 center/cover no-repeat;color:#fff;font:500 34px/1.3 Manrope,system-ui,sans-serif;overflow:hidden}
#bar{display:flex;flex-direction:column;align-items:center;padding:28px 36px;border-radius:32px;background:rgba(14,16,22,.55)}
#row{display:flex}
.port{margin:0 9px;min-width:250px;padding:20px 26px;border-radius:22px;background:rgba(255,255,255,.08);text-align:center;border:3px solid transparent}
.port.sel{background:rgba(255,255,255,.22);border-color:#fff}
.port small{display:block;font-size:24px;opacity:.7;margin-top:4px}
.port.cur small:after{content:" · now"}
#msg{min-height:1.3em;font-size:26px;opacity:.85;margin-top:22px}
html{display:flex;align-items:center;justify-content:center}
body{display:flex;align-items:center;justify-content:center;width:100%}
#bar{position:static;transform:none;margin:0;width:max-content}
</style>
</head>
<body>
<div id="bar">
  <div id="row"></div>
  <div id="msg"></div>
</div>
<script src="assets/wallpapers/catalog.js"></script>
<script>
(function () {
  'use strict';
  var T = window.tizen, W = T && T.tvwindow;
  var ports = [], idx = 0, current = null, busy = false;
  var handedOver = false;
  var wanted = Number((/[?&]port=(\d+)/.exec(window.location.search) || [])[1]) || 0;
  /* Same blurred panel backdrop the Home sheets use, for the wallpaper saved on this TV. */
  try {
    var saved = JSON.parse(localStorage.getItem('cleanframe.home.v1') || '{}'), id = saved.look && saved.look.wall || saved.wallpaper;
    var known = (window.CleanFrameWallpapers || []).some(function (w) { return w.id === id; });
    if (known) document.body.style.backgroundImage = 'url(assets/wallpapers/' + id + '-panel.jpg)';
  } catch (e) {}
  var row = document.getElementById('row'), msg = document.getElementById('msg');

  function text(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function render() {
    row.innerHTML = ports.map(function (p, i) {
      var cls = 'port' + (i === idx ? ' sel' : '') + (current === p.number ? ' cur' : '');
      return '<div class="' + cls + '">' + text(p.editName || 'HDMI ' + p.number) + '<small>' + (p.editName ? 'HDMI ' + p.number : (p.connected ? 'Connected' : 'No signal')) + '</small></div>';
    }).join('');
  }
  function say(m) { msg.textContent = m || ''; }
  function failText(e) { return (e && (e.message || e.name)) || 'The TV refused the request.'; }
  function home() { window.location.href = 'index.html'; }

  function readCurrent() {
    try { var s = W.getSource('MAIN'); current = s && s.type === 'HDMI' ? s.number : null; } catch (e) { current = null; }
  }
  function load() {
    if (!W || !T.systeminfo) { say('Open CleanFrame on the TV to switch inputs.'); return; }
    try {
      T.systeminfo.getPropertyValue('VIDEOSOURCE', function (v) {
        var on = v.connected || [], off = v.disconnected || [];
        on.concat(off).forEach(function (s) {
          if (s.type === 'HDMI') ports.push({ raw: s, number: s.number, editName: s.editName, connected: on.indexOf(s) >= 0 });
        });
        ports.sort(function (a, b) { return a.number - b.number; });
        readCurrent();
        ports.forEach(function (p, i) { if (p.number === current) idx = i; });
        if (!ports.length) say('The TV reports no HDMI inputs.');
        render();
        if (wanted) {
          var at = -1;
          ports.forEach(function (p, i) { if (p.number === wanted) at = i; });
          if (at >= 0) { idx = at; render(); apply(); }
          else say('HDMI ' + wanted + ' is not available on this TV.');
        }
      }, function (e) { say('Could not read the TV inputs. ' + failText(e)); });
    } catch (e) { say('Could not read the TV inputs. ' + failText(e)); }
  }
  function handOver() {
    handedOver = true;
    setTimeout(function () { if (handedOver) document.body.style.visibility = 'hidden'; }, 150);
    try {
      T.application.launch('org.tizen.tv-viewer', function () { busy = false; },
        function (e) { say('Input set, but the TV viewer would not open. ' + failText(e)); busy = false; });
    } catch (e) { say('Input set, but the TV viewer would not open. ' + failText(e)); busy = false; }
  }
  function apply() {
    var p = ports[idx];
    if (!p || busy) return;
    busy = true; say('Switching to HDMI ' + p.number + '…');
    try {
      W.setSource(p.raw, function () { current = p.number; render(); handOver(); },
        function (e) { say('Could not switch. ' + failText(e)); busy = false; }, 'MAIN');
    } catch (e) { say('Could not switch. ' + failText(e)); busy = false; }
  }
  function leave() { home(); }
  /* Coming back from the TV viewer: return to the Dock, not a stale 'Switching…' picker. */
  document.addEventListener('visibilitychange', function () {
    if (handedOver) { if (document.hidden) home(); else document.body.style.visibility = 'hidden'; }
  });
  document.addEventListener('keydown', function (ev) {
    var k = ev.keyCode;
    if (k === 10009 || k === 27 || k === 8 || k === 461) { ev.preventDefault(); leave(); return; }
    if (k === 37 && idx > 0) { idx--; render(); }
    else if (k === 39 && idx < ports.length - 1) { idx++; render(); }
    else if (k === 13) apply();
  });
  load();
}());
</script>
</body>
</html>
