<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanFrame API probe</title>
<style>
html,body{margin:0;background:#000;color:#fff;font:26px/1.3 monospace}
#o{display:none}
#top{font-size:40px;line-height:1.5;word-break:break-all}
</style>
</head>
<body><div id="top" style="white-space:pre-wrap;padding:40px 60px 0"></div><div id="o">Probing…</div>
<script>
(function () {
  var out = [];
  function line(s) { out.push(s); }
  function section(title) { line('=== ' + title + ' ==='); }
  function keys(obj) {
    var k = [];
    try { for (var p in obj) k.push(p); } catch (e) { return ['(error ' + e + ')']; }
    return k;
  }
  function describe(name, obj) {
    if (typeof obj === 'undefined' || obj === null) { line(name + ': absent'); return; }
    line(name + ': ' + keys(obj).join(', '));
  }
  line('CleanFrame read-only API probe. Nothing is launched or changed. Press Back to exit.');
  line('UA: ' + navigator.userAgent.replace(/^.*?\(/, '('));
  section('tvwindow read-only checks');
  describe('tizen', window.tizen);
  var t = window.tizen || {};
  ['application', 'tvinputdevice', 'tvwindow', 'tvchannel', 'systeminfo', 'tvaudiocontrol', 'filesystem'].forEach(function (n) { describe('tizen.' + n, t[n]); });
  describe('webapis', window.webapis);
  var w = window.webapis || {};
  keys(w).forEach(function (n) { if (w[n] && typeof w[n] === 'object') describe('webapis.' + n, w[n]); });
  try {
    var info = t.application.getAppInfo('org.tizen.tv-viewer');
    line('getAppInfo tv-viewer: ' + JSON.stringify(info));
  } catch (e) { line('getAppInfo tv-viewer: ' + (e && e.message || e)); }
  function members(label, obj) {
    if (!obj) { line(label + ': absent'); return; }
    var names = [], seen = {}, o = obj, depth = 0;
    while (o && depth < 3) {
      Object.getOwnPropertyNames(o).forEach(function (n) {
        if (seen[n] || n === 'constructor') return;
        seen[n] = 1;
        var d = Object.getOwnPropertyDescriptor(o, n);
        names.push(d && typeof d.value === 'function' ? n + '/' + d.value.length : n + (d && d.get ? '(accessor)' : ''));
      });
      o = Object.getPrototypeOf(o); depth++;
    }
    line(label + ' [' + typeof obj + ']: ' + names.join(', '));
  }
  members('tizen.tvwindow', t.tvwindow);
  members('webapis.avinfo', w.avinfo);
  if (t.tvwindow) {
    try {
      line('tizen.tvwindow.getAvailableWindows.length=' + t.tvwindow.getAvailableWindows.length);
    } catch (e) { line('tvwindow getAvailableWindows length error: ' + (e && e.message || e)); }
    try {
      line('tizen.tvwindow.getSource.length=' + t.tvwindow.getSource.length);
    } catch (e) { line('tvwindow getSource length error: ' + (e && e.message || e)); }
    try {
      line('tizen.tvwindow.setSource.length=' + t.tvwindow.setSource.length + ' (NOT CALLED)');
    } catch (e) { line('tvwindow setSource length error: ' + (e && e.message || e)); }
    var topOut = ['TVWINDOW RESULTS v6 (read-only, Back to exit)', 'getAvailableWindows: pending', 'getSource(MAIN): pending', 'getVideoResolution: pending'];
    function tl(i, s) { topOut[i] = s; document.getElementById('top').textContent = topOut.join('\n'); }
    tl(0, topOut[0]);
    function safe(s) { try { return JSON.stringify(s); } catch (e) { return String(s); } }
    try {
      t.tvwindow.getAvailableWindows(function (wins) {
        tl(1, 'getAvailableWindows ok: ' + safe(wins));
      }, function (err) {
        tl(1, 'getAvailableWindows error: ' + safe(err) + ' ' + (err && err.name) + ' ' + (err && err.message));
      });
    } catch (e) { tl(1, 'getAvailableWindows threw: ' + (e && e.message || e)); }
    try {
      t.tvwindow.getSource('MAIN', function (src) {
        tl(2, 'getSource(MAIN) ok: ' + safe(src));
      }, function (err) {
        tl(2, 'getSource(MAIN) error: ' + safe(err) + ' ' + (err && err.name) + ' ' + (err && err.message));
      });
    } catch (e) { tl(2, 'getSource(MAIN) threw: ' + (e && e.message || e)); }
    try {
      var rv = t.tvwindow.getVideoResolution('MAIN', function (r) {
        tl(3, 'getVideoResolution ok: ' + safe(r));
      }, function (err) {
        tl(3, 'getVideoResolution error: ' + safe(err) + ' ' + (err && err.name) + ' ' + (err && err.message));
      });
      if (rv !== undefined) tl(3, 'getVideoResolution returned: ' + safe(rv));
    } catch (e) { tl(3, 'getVideoResolution threw: ' + (e && e.message || e)); }
  } else {
    line('tizen.tvwindow absent');
  }
  section('API inventory');
  var tvs = w.tvs || {};
  ['SourceControl', 'AVControl', 'ServiceNavigation', 'NavigationCriteria', 'CriteriaHelper'].forEach(function (n) {
    members('webapis.tvs.' + n, tvs[n]);
    if (tvs[n] && tvs[n].prototype) members('webapis.tvs.' + n + '.prototype', tvs[n].prototype);
  });
  if (tvs.SourceControl && tvs.SourceControl.SourceType) line('SourceType: ' + JSON.stringify(tvs.SourceControl.SourceType));
  try {
    t.application.getAppsInfo(function (list) {
      var hits = list.filter(function (a) { return /viewer|source|hdmi|selector/i.test(a.id + ' ' + a.name); });
      line('appsInfo matches: ' + hits.map(function (a) { return a.id + '=' + a.name; }).join(' | '));
      show();
    }, function (e) { line('getAppsInfo failed: ' + (e && e.message || e)); show(); });
  } catch (e) { line('getAppsInfo error: ' + e); show(); }
  function show() { document.getElementById('o').textContent = out.join('\n\n'); }
  show();
  document.addEventListener('keydown', function (ev) {
    if (ev.keyCode === 10009 || ev.keyCode === 27) { try { t.application.getCurrentApplication().exit(); } catch (e) {} }
  });
}());
</script>
</body>
</html>
